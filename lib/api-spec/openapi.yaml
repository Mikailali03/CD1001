          type: string
          format: date-time

    CompleteJobBody:
      type: object
      required: [workSummary]
      properties:
        workSummary:
          type: string
          description: What was done — written to the homeowner's asset service history
        cost:
          type: number
          description: Total cost charged (optional)
        nextServiceDate:
          type: string
          description: Recommended next service date (YYYY-MM-DD, optional)

    # ─── Dashboard ──────────────────────────────────────────────────────────────
    Dashboard:
      type: object
      required: [totalProperties, totalAssets, verifiedAssets, overdueTaskCount, upcomingTasks, recentRecords, homeHealthScore, homeHealthGrade]
      properties:
        totalProperties:
          type: integer
        totalAssets:
          type: integer
        verifiedAssets:
          type: integer
        unverifiedAssets:
          type: integer
        overdueTaskCount:
          type: integer
        dueSoonTaskCount:
          type: integer
        homeHealthScore:
          type: integer
          description: Aggregate 0–100 health score across all properties
        homeHealthGrade:
          type: string
          enum: [A, B, C, D, F]
          description: Letter grade derived from homeHealthScore
        scoringBreakdown:
          type: object
          properties:
            assetAgeScore:
              type: integer
              description: Average score from asset age vs lifespan (0–100)
            overdueScore:
              type: integer
              description: Penalty component from overdue tasks (0–100)
            criticalAssets:
              type: array
              description: Assets with score below 40 — near end of life
              items:
                $ref: "#/components/schemas/AssetHealthScore"
        upcomingTasks:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceTask"
        recentRecords:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRecord"
        assetHealthByCategory:
          type: array
          items:
            type: object
            required: [category, total, verified]
            properties:
              category:
                type: string
              total:
                type: integer
              verified:
                type: integer

    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [service_record, maintenance_completed, asset_added, asset_verified]
        title:
          type: string
        description:
          type: string
        propertyName:
          type: string
        assetName:
          type: string
        createdAt:
          type: string
          format: date-time

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ─── Admin ──────────────────────────────────────────────────────────────────
