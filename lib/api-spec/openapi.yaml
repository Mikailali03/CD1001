        address:
          type: string
        ownerEmailUpdated:
          type: boolean
        latLngUpdated:
          type: boolean
        error:
          type: string

    BackfillResult:
      type: object
      required: [total, ownerEmailUpdated, latLngUpdated, errors, rows]
      properties:
        total:
          type: integer
        ownerEmailUpdated:
          type: integer
        latLngUpdated:
          type: integer
        errors:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BackfillResultRow"

    AdminProperty:
      type: object
      required: [id, name, address, userId, assetCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        yearBuilt:
          type: integer
