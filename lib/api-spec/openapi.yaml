      type: object
      required: [totalUsers, totalProperties, totalTechnicians, totalServiceRecords]
      properties:
        totalUsers:
          type: integer
        totalProperties:
          type: integer
        totalTechnicians:
          type: integer
        totalServiceRecords:
          type: integer

    AdminUser:
      type: object
