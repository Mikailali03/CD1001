  # ─── Deed transfer ──────────────────────────────────────────────────────────
  /properties/{propertyId}/transfer:
    get:
      operationId: getPendingPropertyTransfer
      tags: [properties]
      summary: The property's pending deed transfer, or null (owner only)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending transfer or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PropertyTransfer"
                  - type: "null"
        "404":
          description: Property not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: initiatePropertyTransfer
      tags: [properties]
      summary: Start a deed transfer to another email (cancels any pending one)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePropertyTransferBody"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyTransfer"
        "400":
          description: Cannot transfer to yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Sender email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Property not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /transfers/{transferId}:
    delete:
      operationId: cancelPropertyTransfer
      tags: [properties]
      summary: Cancel a pending deed transfer (owner only)
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyTransfer"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Transfer not found or already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /transfers/claim/{token}:
    get:
      operationId: getTransferClaim
      tags: [properties]
      summary: Public details of a pending transfer for the claim page
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transfer and property summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferClaimDetails"
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Transfer completed, cancelled or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferGoneError"
    post:
      operationId: claimPropertyTransfer
      tags: [properties]
      summary: Accept a transfer; the signed-in user (matching verified email) becomes the owner
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: Send `{}` if there is nothing to include
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPropertyTransferBody"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPropertyTransferResult"
        "403":
          description: Wrong recipient email or property limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Transfer completed, cancelled or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

