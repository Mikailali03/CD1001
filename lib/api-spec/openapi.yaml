        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        yearBuilt:
          type: integer
        sqft:
          type: integer
        bedrooms:
          type: integer
        bathrooms:
          type: number
        latitude:
          type: number
        longitude:
