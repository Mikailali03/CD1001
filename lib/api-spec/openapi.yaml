      properties:
        id:
          type: string
        name:
          type: string
        templateId:
          type: string
        triggerEvent:
          type: string
          enum: [technician_accepted_job, job_completed, overdue_maintenance, asset_end_of_life, property_transfer_initiated, new_feature_announcement, monthly_update, custom]
        conditions:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertEmailTriggerBody:
      type: object
      required: [name, triggerEvent]
      properties:
        name:
          type: string
        templateId:
          type: string
        triggerEvent:
          type: string
          enum: [technician_accepted_job, job_completed, overdue_maintenance, asset_end_of_life, property_transfer_initiated, new_feature_announcement, monthly_update, custom]
        conditions:
