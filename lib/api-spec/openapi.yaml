      summary: Address suggestions as the user types (empty list when unavailable)
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressAutocompleteResult"

  /properties/lookup:
    get:
      operationId: lookupProperty
      tags: [properties]
      summary: Look up public property details for an address
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            minLength: 5
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyLookupResult"
        "404":
          description: No property found for that address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Lookup provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

