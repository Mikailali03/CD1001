openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casa Dossier — Home Maintenance OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Property management
  - name: assets
    description: Asset (appliance/system) management
  - name: records
    description: Service history records
  - name: maintenance
    description: Maintenance schedules and tasks
  - name: guides
    description: DIY guide library
  - name: marketplace
    description: Service pro marketplace
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: user
    description: User profile management
  - name: technician
    description: Technician portal endpoints
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: admin
    description: Admin-only platform management endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Properties ────────────────────────────────────────────────────────────
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties for the current user
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyBody"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyBody"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{propertyId}/summary:
    get:
      operationId: getPropertySummary
      tags: [properties]
      summary: Get a property health summary, asset breakdown, and upcoming tasks
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"

  # ─── Collaborators ──────────────────────────────────────────────────────────
  /properties/{propertyId}/collaborators:
    get:
      operationId: listCollaborators
      tags: [properties]
      summary: List collaborators for a property (owner only, managed+ tier)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of collaborators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collaborator"
        "403":
          description: Forbidden — not the owner or insufficient tier
    post:
      operationId: inviteCollaborator
      tags: [properties]
      summary: Invite a collaborator by email (owner only, managed+ tier)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCollaboratorBody"
      responses:
        "201":
          description: Collaborator invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collaborator"
        "403":
          description: Forbidden — not the owner or insufficient tier
        "409":
          description: Already invited

  /properties/{propertyId}/collaborators/{collaboratorId}:
    delete:
      operationId: removeCollaborator
      tags: [properties]
      summary: Remove a collaborator (owner only)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: collaboratorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ─── Assets ────────────────────────────────────────────────────────────────
  /properties/{propertyId}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Add an asset to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get full asset details
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetBody"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Service Records ────────────────────────────────────────────────────────
  /assets/{assetId}/records:
    get:
      operationId: listServiceRecords
      tags: [records]
      summary: List service history for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecord"
    post:
      operationId: createServiceRecord
      tags: [records]
      summary: Log a service event for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRecordBody"
      responses:
        "201":
          description: Created service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  /records/{recordId}:
    get:
      operationId: getServiceRecord
      tags: [records]
      summary: Get a single service record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  # ─── Maintenance ────────────────────────────────────────────────────────────
  /assets/{assetId}/maintenance:
    get:
      operationId: listMaintenanceTasks
      tags: [maintenance]
      summary: List maintenance tasks for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTask"
    post:
      operationId: createMaintenanceTask
      tags: [maintenance]
      summary: Add a maintenance task
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"

  /maintenance/{taskId}:
    patch:
      operationId: updateMaintenanceTask
      tags: [maintenance]
      summary: Mark task complete or update schedule
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"
    delete:
      operationId: deleteMaintenanceTask
      tags: [maintenance]
      summary: Delete a maintenance task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── DIY Guide Library ──────────────────────────────────────────────────────
  /guides:
    get:
      operationId: listGuides
      tags: [guides]
      summary: List DIY maintenance guides
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Guide list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"

  /guides/{guideId}:
    get:
      operationId: getGuide
      tags: [guides]
      summary: Get a single DIY guide
      parameters:
        - name: guideId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guide details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"

  # ─── User Profile ───────────────────────────────────────────────────────────
  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    put:
      operationId: upsertUserProfile
      tags: [user]
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── Marketplace ────────────────────────────────────────────────────────────
  /marketplace/jobs:
    get:
      operationId: listMarketplaceJobs
      tags: [marketplace]
      summary: List service requests posted by the current homeowner
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceJob"
    post:
      operationId: createMarketplaceJob
      tags: [marketplace]
      summary: Post a service request to the marketplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketplaceJobBody"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceJob"

  /marketplace/jobs/open:
    get:
      operationId: listOpenMarketplaceJobs
      tags: [technician]
      summary: List all open jobs visible to technicians (with location)
      responses:
        "200":
          description: List of open jobs with location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechJobSummary"

  /marketplace/jobs/{jobId}/details:
    get:
      operationId: getMarketplaceJobDetails
      tags: [technician]
      summary: Get full job details including asset info and service history
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechJobDetail"
        "404":
          description: Job not found

  /marketplace/jobs/{jobId}/accept:
    post:
      operationId: acceptMarketplaceJob
      tags: [technician]
      summary: Technician accepts a job (reveals homeowner contact phone)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted job with contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechJobDetail"
        "404":
          description: Job not found

  /marketplace/jobs/assigned:
    get:
      operationId: listAssignedJobs
      tags: [technician]
      summary: List jobs claimed by the current technician
      responses:
        "200":
          description: List of claimed jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignedJobSummary"

  /marketplace/jobs/{jobId}/schedule:
    patch:
      operationId: scheduleMarketplaceJob
      tags: [technician]
      summary: Set a scheduled date and time for a claimed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleJobBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  scheduledAt:
                    type: string
                    format: date-time
        "404":
          description: Job not found

  /marketplace/jobs/{jobId}/complete:
    post:
      operationId: completeMarketplaceJob
      tags: [technician]
      summary: Mark a claimed job as complete and write a verified service record
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobBody"
      responses:
        "200":
          description: Job marked complete, service record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  serviceRecordId:
                    type: string
        "400":
          description: Job not yet scheduled or not in claimed status
        "404":
          description: Job not found or not assigned to you

  # ─── Inbox ──────────────────────────────────────────────────────────────────
  /inbox:
    get:
      operationId: getInbox
      tags: [properties]
      summary: Pending deed transfers and collaborator invites addressed to the current user
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"

  /inbox/transfers/{id}/claim:
    post:
      operationId: claimInboxTransfer
      tags: [properties]
      summary: Accept a pending deed transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /inbox/collaborators/{id}/accept:
    post:
      operationId: acceptInboxCollaborator
      tags: [properties]
      summary: Accept a pending collaborator invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted

  /inbox/collaborators/{id}:
    delete:
      operationId: declineInboxCollaborator
      tags: [properties]
      summary: Decline a pending collaborator invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Declined

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Overall dashboard — upcoming tasks, recent service, asset health across all properties
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/activity:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Recent activity feed across all properties and assets
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ─── Admin ──────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide stats for admin dashboard
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users on the platform
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [homeowner, technician, admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user's role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/email-templates:
    get:
      operationId: listEmailTemplates
      tags: [admin]
      summary: List all email templates
      responses:
        "200":
          description: List of email templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
    post:
      operationId: createEmailTemplate
      tags: [admin]
      summary: Create an email template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEmailTemplateBody"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"

  /admin/email-templates/{templateId}:
    put:
      operationId: updateEmailTemplate
      tags: [admin]
      summary: Update an email template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEmailTemplateBody"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
    delete:
      operationId: deleteEmailTemplate
      tags: [admin]
      summary: Delete an email template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/email-triggers:
    get:
      operationId: listEmailTriggers
      tags: [admin]
      summary: List all email triggers
      responses:
        "200":
          description: List of email triggers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTrigger"
    post:
      operationId: createEmailTrigger
      tags: [admin]
      summary: Create an email trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEmailTriggerBody"
      responses:
        "201":
          description: Created trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTrigger"

  /admin/email-triggers/{triggerId}:
    put:
      operationId: updateEmailTrigger
      tags: [admin]
      summary: Update an email trigger
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEmailTriggerBody"
      responses:
        "200":
          description: Updated trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTrigger"
    delete:
      operationId: deleteEmailTrigger
      tags: [admin]
      summary: Delete an email trigger
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/email-triggers/{triggerId}/toggle:
    patch:
      operationId: toggleEmailTrigger
      tags: [admin]
      summary: Toggle an email trigger active/inactive
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTrigger"

  /admin/backfill-user-profiles:
    post:
      operationId: backfillUserProfiles
      tags: [admin]
      summary: Backfill user_profiles table from Clerk for all existing users
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileBackfillResult"

  /admin/backfill-properties:
    post:
      operationId: backfillProperties
      tags: [admin]
      summary: Backfill owner_email and lat/lng for all properties
      responses:
        "200":
          description: Backfill result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillResult"

  /admin/properties:
    get:
      operationId: listAdminProperties
      tags: [admin]
      summary: List all properties on the platform with owner info
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProperty"

  /admin/technicians:
    get:
      operationId: listAdminTechnicians
      tags: [admin]
      summary: List all technicians with job stats
      responses:
        "200":
          description: List of technicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTechnician"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Platform analytics data for charts
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Inbox ─────────────────────────────────────────────────────────────────
    InboxTransferItem:
      type: object
      required: [id, propertyId, fromUserId, fromEmail, toEmail, status, token, createdAt, property]
      properties:
        id:
          type: string
        propertyId:
          type: string
        fromUserId:
          type: string
        fromEmail:
          type: string
        toEmail:
          type: string
        toUserId:
          type: string
          nullable: true
        status:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        property:
          $ref: "#/components/schemas/Property"

    InboxCollaboratorItem:
      type: object
      required: [id, propertyId, invitedByUserId, invitedEmail, status, createdAt, property]
      properties:
        id:
          type: string
        propertyId:
          type: string
        invitedByUserId:
          type: string
        invitedEmail:
          type: string
        acceptedUserId:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        property:
          $ref: "#/components/schemas/Property"

    Inbox:
      type: object
      required: [transfers, collaboratorInvites]
      properties:
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/InboxTransferItem"
        collaboratorInvites:
          type: array
          items:
            $ref: "#/components/schemas/InboxCollaboratorItem"

    # ─── Collaborators ──────────────────────────────────────────────────────────
    Collaborator:
      type: object
      required: [id, propertyId, invitedByUserId, invitedEmail, status, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        invitedByUserId:
          type: string
        invitedEmail:
          type: string
        acceptedUserId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted]
        createdAt:
          type: string
          format: date-time

    InviteCollaboratorBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    # ─── Property ──────────────────────────────────────────────────────────────
    Property:
      type: object
      required: [id, name, address, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: Friendly name (e.g. "The Smith Family Home")
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        yearBuilt:
          type: integer
        sqft:
          type: integer
        bedrooms:
          type: integer
        bathrooms:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        photoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePropertyBody:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        yearBuilt:
          type: integer
        sqft:
          type: integer
        bedrooms:
          type: integer
        bathrooms:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        photoUrl:
          type: string

    UpdatePropertyBody:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        yearBuilt:
          type: integer
        sqft:
          type: integer
        bedrooms:
          type: integer
        bathrooms:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        photoUrl:
          type: string

    AssetHealthScore:
      type: object
      required: [assetId, assetName, category, score, ageYears, lifespanYears]
      properties:
        assetId:
          type: string
        assetName:
          type: string
        category:
          type: string
        score:
          type: integer
          description: 0–100 health score for this asset based on age vs expected lifespan
        ageYears:
          type: number
        lifespanYears:
          type: integer
        installDate:
          type: string

    PropertySummary:
      type: object
      required: [propertyId, healthScore, healthGrade, totalAssets, verifiedAssets, overdueTaskCount, upcomingTasks, assetsByCategory, assetScores]
      properties:
        propertyId:
          type: string
        healthScore:
          type: integer
          description: 0–100 score based on asset age vs lifespan and overdue maintenance tasks
        healthGrade:
          type: string
          enum: [A, B, C, D, F]
          description: Letter grade derived from healthScore
        totalAssets:
          type: integer
        verifiedAssets:
          type: integer
        overdueTaskCount:
          type: integer
        upcomingTasks:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceTask"
        assetsByCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
        assetScores:
          type: array
          items:
            $ref: "#/components/schemas/AssetHealthScore"
        scoringBreakdown:
          type: object
          properties:
            assetAgeScore:
              type: integer
            overdueScore:
              type: integer
            criticalAssets:
              type: array
              items:
                $ref: "#/components/schemas/AssetHealthScore"
        recentRecords:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRecord"

    # ─── Asset ─────────────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, propertyId, name, category, status, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        name:
          type: string
          description: Plain-language name (e.g. "Central AC Unit", "Water Heater")
        category:
          type: string
          enum: [HVAC, Plumbing, Electrical, Roof, Appliance, Structural, Other]
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        installDate:
          type: string
          format: date
        warrantyExpiry:
          type: string
          format: date
        status:
          type: string
          enum: [verified, unverified, needs_attention]
        notes:
          type: string
        photoUrl:
          type: string
        replacementCost:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
          nullable: true

    CreateAssetBody:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [HVAC, Plumbing, Electrical, Roof, Appliance, Structural, Other]
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        installDate:
          type: string
          format: date
        warrantyExpiry:
          type: string
          format: date
        notes:
          type: string
        photoUrl:
          type: string
        replacementCost:
          type: number

    UpdateAssetBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [HVAC, Plumbing, Electrical, Roof, Appliance, Structural, Other]
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        installDate:
          type: string
          format: date
        warrantyExpiry:
          type: string
          format: date
        status:
          type: string
          enum: [verified, unverified, needs_attention]
        notes:
          type: string
        photoUrl:
          type: string
        retiredAt:
          type: string
          format: date-time
          nullable: true
        replacementCost:
          type: number

    # ─── Service Record ─────────────────────────────────────────────────────────
    ServiceRecord:
      type: object
      required: [id, assetId, date, description, createdAt]
      properties:
        id:
          type: string
        assetId:
          type: string
        date:
          type: string
          format: date
        technicianName:
          type: string
        companyName:
          type: string
        description:
          type: string
        cost:
          type: number
        nextServiceDate:
          type: string
          format: date
        receiptUrl:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateServiceRecordBody:
      type: object
      required: [date, description]
      properties:
        date:
          type: string
          format: date
        technicianName:
          type: string
        companyName:
          type: string
        description:
          type: string
        cost:
          type: number
        nextServiceDate:
          type: string
          format: date
        receiptUrl:
          type: string
        verified:
          type: boolean

    # ─── Maintenance Task ───────────────────────────────────────────────────────
    MaintenanceTask:
      type: object
      required: [id, assetId, title, intervalDays, nextDueDate, isDiy, createdAt]
      properties:
        id:
          type: string
        assetId:
          type: string
        title:
          type: string
        description:
          type: string
        intervalDays:
          type: integer
        nextDueDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
        isDiy:
          type: boolean
        estimatedCost:
          type: number
        createdAt:
          type: string
          format: date-time

    CreateMaintenanceTaskBody:
      type: object
      required: [title, intervalDays, nextDueDate, isDiy]
      properties:
        title:
          type: string
        description:
          type: string
        intervalDays:
          type: integer
        nextDueDate:
          type: string
          format: date
        isDiy:
          type: boolean
        estimatedCost:
          type: number

    UpdateMaintenanceTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        intervalDays:
          type: integer
        nextDueDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
        isDiy:
          type: boolean
        estimatedCost:
          type: number

    # ─── DIY Guide ──────────────────────────────────────────────────────────────
    Guide:
      type: object
      required: [id, category, title, difficulty, estimatedMinutes, createdAt]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [HVAC, Plumbing, Electrical, Roof, Appliance, Structural, Other]
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        estimatedMinutes:
          type: integer
        toolsNeeded:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: object
            required: [step, instruction]
            properties:
              step:
                type: integer
              instruction:
                type: string
        createdAt:
          type: string
          format: date-time

    # ─── User Profile ────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [userId, firstName, lastName, role]
      properties:
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [homeowner, technician, admin]
        technicianNumber:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertUserProfileBody:
      type: object
      required: [firstName, lastName, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [homeowner, technician, admin]
        phone:
