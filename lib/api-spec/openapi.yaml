openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casa Dossier — Home Maintenance OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Property management
  - name: assets
    description: Asset (appliance/system) management
  - name: records
    description: Service history records
  - name: maintenance
    description: Maintenance schedules and tasks
  - name: guides
    description: DIY guide library
  - name: marketplace
    description: Service pro marketplace
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: user
    description: User profile management
  - name: technician
    description: Technician portal endpoints
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: locker
    description: Digital locker — photo and file storage
  - name: admin
    description: Admin-only platform management endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Properties ────────────────────────────────────────────────────────────
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties for the current user
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyBody"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyBody"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{propertyId}/summary:
    get:
      operationId: getPropertySummary
      tags: [properties]
      summary: Get a property health summary, asset breakdown, and upcoming tasks
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"

  # ─── Collaborators ──────────────────────────────────────────────────────────
  /properties/{propertyId}/collaborators:
    get:
      operationId: listCollaborators
      tags: [properties]
      summary: List collaborators for a property (owner only, managed+ tier)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of collaborators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collaborator"
        "403":
          description: Forbidden — not the owner or insufficient tier
    post:
      operationId: inviteCollaborator
      tags: [properties]
      summary: Invite a collaborator by email (owner only, managed+ tier)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCollaboratorBody"
      responses:
        "201":
          description: Collaborator invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collaborator"
        "403":
          description: Forbidden — not the owner or insufficient tier
        "409":
          description: Already invited

  /properties/{propertyId}/collaborators/{collaboratorId}:
    delete:
      operationId: removeCollaborator
      tags: [properties]
      summary: Remove a collaborator (owner only)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: collaboratorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ─── Assets ────────────────────────────────────────────────────────────────
  /properties/{propertyId}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: includeRetired
          in: query
          description: Include retired (decommissioned) assets
          schema:
            type: boolean
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Add an asset to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get full asset details
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetBody"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Service Records ────────────────────────────────────────────────────────
  /assets/{assetId}/records:
    get:
      operationId: listServiceRecords
      tags: [records]
      summary: List service history for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecord"
    post:
      operationId: createServiceRecord
      tags: [records]
      summary: Log a service event for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRecordBody"
      responses:
        "201":
          description: Created service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  /records/{recordId}:
    get:
      operationId: getServiceRecord
      tags: [records]
      summary: Get a single service record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  # ─── Maintenance ────────────────────────────────────────────────────────────
  /assets/{assetId}/maintenance:
    get:
      operationId: listMaintenanceTasks
      tags: [maintenance]
      summary: List maintenance tasks for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTask"
    post:
      operationId: createMaintenanceTask
      tags: [maintenance]
      summary: Add a maintenance task
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"

  /maintenance/{taskId}:
    patch:
      operationId: updateMaintenanceTask
      tags: [maintenance]
      summary: Mark task complete or update schedule
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"
    delete:
      operationId: deleteMaintenanceTask
      tags: [maintenance]
      summary: Delete a maintenance task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── DIY Guide Library ──────────────────────────────────────────────────────
  /guides:
    get:
      operationId: listGuides
      tags: [guides]
      summary: List DIY maintenance guides
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Guide list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"
    post:
      operationId: createGuide
      tags: [guides]
      summary: Publish a new DIY guide and notify all users (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuideBody"
      responses:
        "201":
          description: Guide created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"
        "403":
          description: Admin only

  /guides/{guideId}:
    get:
      operationId: getGuide
      tags: [guides]
      summary: Get a single DIY guide
      parameters:
        - name: guideId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guide details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"

  # ─── User Profile ───────────────────────────────────────────────────────────
  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    put:
      operationId: upsertUserProfile
      tags: [user]
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── Marketplace ────────────────────────────────────────────────────────────
  /marketplace/jobs:
    get:
      operationId: listMarketplaceJobs
      tags: [marketplace]
      summary: List service requests posted by the current homeowner
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceJob"
    post:
      operationId: createMarketplaceJob
      tags: [marketplace]
      summary: Post a service request to the marketplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketplaceJobBody"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceJob"

  /marketplace/jobs/open:
    get:
      operationId: listOpenMarketplaceJobs
      tags: [technician]
      summary: List all open jobs visible to technicians (with location)
      responses:
        "200":
          description: List of open jobs with location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechJobSummary"

  /marketplace/jobs/{jobId}/details:
    get:
      operationId: getMarketplaceJobDetails
      tags: [technician]
      summary: Get full job details including asset info and service history
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechJobDetail"
        "404":
          description: Job not found

  /marketplace/jobs/{jobId}/accept:
    post:
      operationId: acceptMarketplaceJob
      tags: [technician]
      summary: Technician accepts a job (reveals homeowner contact phone)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted job with contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechJobDetail"
        "404":
          description: Job not found

  /marketplace/jobs/assigned:
    get:
      operationId: listAssignedJobs
      tags: [technician]
      summary: List jobs claimed by the current technician
      responses:
        "200":
          description: List of claimed jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignedJobSummary"

  /marketplace/jobs/{jobId}/schedule:
    patch:
      operationId: scheduleMarketplaceJob
      tags: [technician]
      summary: Set a scheduled date and time for a claimed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleJobBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  scheduledAt:
                    type: string
                    format: date-time
        "404":
          description: Job not found

  /marketplace/jobs/{jobId}/en-route:
    post:
      operationId: markJobEnRoute
      tags: [technician]
      summary: Mark technician as on the way — only available on the day of the appointment
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status updated to en_route
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Not the day of the appointment or wrong status
        "404":
          description: Job not found or not assigned to you

  /marketplace/jobs/{jobId}/arrived:
    post:
      operationId: markJobArrived
      tags: [technician]
      summary: Mark technician as arrived — only available after en_route
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status updated to arrived
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Not in en_route status
        "404":
          description: Job not found or not assigned to you

  /marketplace/jobs/{jobId}/complete:
    post:
      operationId: completeMarketplaceJob
      tags: [technician]
      summary: Mark a claimed job as complete and write a verified service record
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobBody"
      responses:
        "200":
          description: Job marked complete, service record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  serviceRecordId:
                    type: string
        "400":
          description: Job not yet scheduled or not in claimed status
        "404":
          description: Job not found or not assigned to you

  # ─── Inbox ──────────────────────────────────────────────────────────────────
  /inbox:
    get:
      operationId: getInbox
      tags: [properties]
      summary: Pending deed transfers and collaborator invites addressed to the current user
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"

  /inbox/transfers/{id}/claim:
    post:
      operationId: claimInboxTransfer
      tags: [properties]
      summary: Accept a pending deed transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /inbox/collaborators/{id}/accept:
    post:
      operationId: acceptInboxCollaborator
      tags: [properties]
      summary: Accept a pending collaborator invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted

  /inbox/collaborators/{id}:
    delete:
      operationId: declineInboxCollaborator
      tags: [properties]
      summary: Decline a pending collaborator invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Declined

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Overall dashboard — upcoming tasks, recent service, asset health across all properties
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/activity:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Recent activity feed across all properties and assets
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ─── Digital Locker ─────────────────────────────────────────────────────────
  /locker/folders:
    get:
      operationId: listLockerFolders
      tags: [locker]
      summary: List all folders for the current user
      responses:
        "200":
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LockerFolder"
    post:
      operationId: createLockerFolder
      tags: [locker]
      summary: Create a new folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLockerFolderBody"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerFolder"

  /locker/folders/{folderId}:
    patch:
      operationId: updateLockerFolder
      tags: [locker]
      summary: Rename a folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLockerFolderBody"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerFolder"
    delete:
      operationId: deleteLockerFolder
      tags: [locker]
      summary: Delete a folder (files become unorganized)
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /locker/files:
    get:
      operationId: listLockerFiles
      tags: [locker]
      summary: List files, optionally filtered by folder
      parameters:
        - name: folderId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LockerFile"
    post:
      operationId: createLockerFile
      tags: [locker]
      summary: Save file metadata after a successful presigned upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLockerFileBody"
      responses:
        "201":
          description: Created file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerFile"

  /locker/files/{fileId}:
    patch:
      operationId: updateLockerFile
      tags: [locker]
      summary: Update file name or move to a different folder
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLockerFileBody"
      responses:
        "200":
          description: Updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerFile"
    delete:
      operationId: deleteLockerFile
      tags: [locker]
      summary: Delete a file record
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Admin ──────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide stats for admin dashboard
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users on the platform
