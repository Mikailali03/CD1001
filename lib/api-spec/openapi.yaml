    # ─── Marketplace ────────────────────────────────────────────────────────────
    MarketplaceJob:
      type: object
      required: [id, assetId, assetName, assetCategory, description, status, createdAt]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        assetCategory:
          type: string
        assetBrand:
          type: string
        assetModel:
          type: string
        assetSerialNumber:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, completed]
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        technicianName:
          type: string
        technicianPhone:
          type: string
        scheduledAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateMarketplaceJobBody:
      type: object
      required: [assetId, description]
      properties:
        assetId:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        contactPhone:
          type: string

    TechJobSummary:
      type: object
      required: [id, description, urgency, status, city, state, assetCategory, createdAt]
      properties:
        id:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, completed]
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        assetCategory:
          type: string
        assetName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time

    TechJobDetail:
      type: object
      required: [id, description, urgency, status, assetName, assetCategory, createdAt]
      properties:
        id:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, completed]
        assetId:
          type: string
        assetName:
          type: string
        assetCategory:
          type: string
        assetBrand:
          type: string
        assetModel:
          type: string
        assetSerialNumber:
          type: string
        assetInstallDate:
          type: string
        assetWarrantyExpiry:
          type: string
        assetNotes:
          type: string
        propertyAddress:
          type: string
        propertyCity:
          type: string
        propertyState:
          type: string
        propertyZipCode:
          type: string
        propertyYearBuilt:
          type: integer
        serviceHistory:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRecord"
        contactPhone:
          type: string
          description: Only present after job is accepted by this technician
        technicianId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time

    AssignedJobSummary:
      type: object
      required: [id, description, urgency, status, assetName, assetCategory, propertyAddress, propertyCity, propertyState, propertyZipCode, contactPhone, acceptedAt, createdAt]
      properties:
        id:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, completed]
        assetName:
          type: string
        assetCategory:
          type: string
        assetBrand:
          type: string
        assetModel:
          type: string
        propertyAddress:
          type: string
        propertyCity:
          type: string
        propertyState:
          type: string
        propertyZipCode:
          type: string
        contactPhone:
          type: string
        scheduledAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ScheduleJobBody:
      type: object
      required: [scheduledAt]
      properties:
