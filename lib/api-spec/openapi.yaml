      operationId: getPublicQrAsset
      tags: [assets]
      summary: Public, non-sensitive info for a scanned asset label (no auth)
      parameters:
        - name: assetId
          in: path
          required: true
          description: Full asset UUID
          schema:
            type: string
      responses:
        "200":
          description: Public asset label info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrPublicAsset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /qr/assets/{assetId}/access:
    get:
      operationId: getQrAssetAccess
      tags: [assets]
      summary: Whether the signed-in user can open the scanned asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrAssetAccess"

  /tech/assets/{ref}:
    get:
      operationId: getTechnicianScannedAsset
      tags: [technician]
      summary: Technician scan result for an asset (UUID, registry ID, CDA protocol string or label URL)
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechnicianScanResult"
        "400":
          description: Not a recognised asset code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Technician access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Registry ID matches more than one asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

