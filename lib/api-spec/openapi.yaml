        name:
          type: string
        subject:
          type: string
        bodyHtml:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [marketing, notification, transactional]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertEmailTemplateBody:
      type: object
      required: [name, subject, bodyHtml, category]
      properties:
        name:
          type: string
        subject:
          type: string
        bodyHtml:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [marketing, notification, transactional]

    EmailTrigger:
