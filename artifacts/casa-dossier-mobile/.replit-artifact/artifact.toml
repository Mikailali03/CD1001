kind = "mobile"
previewPath = "/mobile/"
title = "Casa Dossier Mobile"
version = "1.0.0"
id = "artifacts/casa-dossier-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24100

[services.development]
run = "pnpm --filter @workspace/casa-dossier-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/casa-dossier-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/casa-dossier-mobile", "run", "serve" ]

[services.env]
PORT = "24100"
BASE_PATH = "/mobile/"
