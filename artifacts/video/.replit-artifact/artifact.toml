kind = "video"
previewPath = "/video/"
title = "Casa Dossier — Marketing Video"
description = "A 56-second animated marketing video for Casa Dossier showcasing the home management platform — from the problem of hidden home complexity, to the solution, key features (Health Score, Asset Tracking, Maintenance, Capital Planning), and the tagline 'Your home, fully managed.'"
version = "1.0.0"
id = "artifacts/video"
router = "path"

[[services]]
name = "web"
paths = [ "/video/" ]
localPort = 24908

[services.development]
run = "pnpm --filter @workspace/video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video", "run", "build" ]
serve = "static"
publicDir = "artifacts/video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24908"
BASE_PATH = "/video/"
